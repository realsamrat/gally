name: Close issues waiting on details

# An issue labelled "needs more info" closes after 14 days without a reply. Any reply keeps it open.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          only-issue-labels: "needs more info"
          # The label is added during triage, so issues are never marked stale automatically.
          days-before-issue-stale: -1
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          stale-issue-label: "needs more info"
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing for now: there has been no reply in 14 days since more details were asked for.
            Add them in a comment any time and this will be reopened.
