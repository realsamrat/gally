name: PR size

# Labels each pull request by how much it changes, so small ones are easy to spot and review first.
# Runs on pull_request_target so it can label PRs from forks. It never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    name: Label by size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sizes = [
              { name: "size:XS", max: 9, color: "0e8a16" },
              { name: "size:S", max: 49, color: "5ebd3e" },
              { name: "size:M", max: 199, color: "fbca04" },
              { name: "size:L", max: 499, color: "fe7d37" },
              { name: "size:XL", max: Infinity, color: "d93f0b" },
            ];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            // Built output and the lockfile are generated, so they don't count.
            const generated = (path) => path.startsWith("dist/") || path === "package-lock.json";
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const lines = files.filter((file) => !generated(file.filename)).reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const size = sizes.find((entry) => lines <= entry.max);

            for (const entry of sizes) {
              const description = entry.max === Infinity ? "500 or more changed lines" : `Up to ${entry.max} changed lines`;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: entry.name });
              } catch {
                await github.rest.issues.createLabel({ owner, repo, name: entry.name, color: entry.color, description: `${description}, not counting dist or the lockfile` });
              }
            }

            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const name of current) {
              if (name.startsWith("size:") && name !== size.name) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }).catch(() => {});
              }
            }
            if (!current.includes(size.name)) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [size.name] });
            core.info(`${lines} changed lines: ${size.name}`);
